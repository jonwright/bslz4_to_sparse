site_name: bslz4_to_sparse
site_description: Bitshuffle-LZ4 Eiger frames straight to sparse pixels and azimuthal integrations
repo_url: https://github.com/jonwright/bslz4_to_sparse
repo_name: jonwright/bslz4_to_sparse
docs_dir: .
site_dir: ../site
exclude_docs: |
  AGENTS.md
  mkdocs.yml

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.instant
    - navigation.sections
    - search.highlight

plugins:
  - search

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - tables
  - pymdownx.highlight
  - pymdownx.superfences

# Every page under gen/ is written by tools/generate_docs.py (docs/AGENTS.md).
nav:
  - Home: index.md
  - Examples:
      - "1: Sparse pixels": gen/examples/ex1_sparse_pixels.md
      - "2: Powder with pyFAI": gen/examples/ex2_pyfai_powder.md
      - "3: Batches and file offsets": gen/examples/ex3_batches_and_offsets.md
      - "4: Pipelines": gen/examples/ex4_pipelines.md
      - "5: Threads": gen/examples/ex5_threads.md
      - "6: Your file and a .poni": gen/examples/ex6_file_and_poni.md
      - "7: Limit pixels, uncompressed frames, decompress alone": gen/examples/ex7_limit_pixels_and_frames.md
      - "8: The conveyor": gen/examples/ex8_conveyor.md
      - "9: The firehose, as a for loop": gen/examples/ex9_firehose.md
      - "10: Writing results and the integrator": gen/examples/ex10_write_results.md
      - "11: Rings per frame for texture work": gen/examples/ex11_rings_per_frame.md
      - "12: Timing the decode": gen/examples/ex12_decode_timing.md
      - "13: Peaks in and out of the powder": real/ex13_peaks_out_of_powder.md
  - Performance:
      - Three data sets: gen/performance.md
      - Every pipeline: gen/kernels.md
  - Reference:
      - API: gen/api.md
      - GPU decoder: gen/gpu.md
      - Conveyor: gen/conveyor.md
      - Pipeline steps and values: gen/pipelines.md
      - Acknowledgements and licences: gen/acknowledgements.md
