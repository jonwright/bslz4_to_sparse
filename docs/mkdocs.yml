site_name: bslz4_to_sparse
site_description: Bitshuffle-LZ4 Eiger frames straight to sparse pixels and azimuthal integrations
repo_url: https://github.com/jonwright/bslz4_to_sparse
repo_name: jonwright/bslz4_to_sparse
docs_dir: .
site_dir: ../site
exclude_docs: |
  AGENTS.md
  mkdocs.yml

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.instant
    - navigation.sections
    - search.highlight

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - pymdownx.highlight
  - pymdownx.superfences

# Every page under gen/ is written by tools/generate_docs.py (docs/AGENTS.md).
nav:
  - Home: index.md
  - Examples:
      - "Released API (0.0.15, 0.0.16), unchanged":
          - "1: Sparse pixels": gen/examples/ex1_sparse_pixels.md
          - "2: Powder with pyFAI": gen/examples/ex2_pyfai_powder.md
          - "3: The raw functions": gen/examples/ex3_raw_functions.md
      - "New in 0.0.22":
          - "4: Batches and file offsets": gen/examples/ex4_batches_and_offsets.md
          - "5: Pipelines": gen/examples/ex5_pipelines.md
          - "6: Threads": gen/examples/ex6_threads.md
          - "7: Your file and a .poni": gen/examples/ex7_file_and_poni.md
          - "8: Limit pixels, uncompressed frames, decompress alone": gen/examples/ex8_limit_pixels_and_frames.md
          - "9: The conveyor": gen/examples/ex9_conveyor.md
          - "10: The firehose, as a for loop": gen/examples/ex10_firehose.md
          - "11: Writing results and the integrator": gen/examples/ex11_write_results.md
          - "12: Rings per frame for texture work": gen/examples/ex12_rings_per_frame.md
          - "13: Timing the decode": gen/examples/ex13_decode_timing.md
  - Performance:
      - Three data sets: gen/performance.md
      - Every pipeline: gen/kernels.md
  - Reference:
      - API: gen/api.md
      - GPU decoder: gen/gpu.md
      - Conveyor: gen/conveyor.md
      - Pipeline steps and values: gen/pipelines.md
      - Acknowledgements and licences: gen/acknowledgements.md
