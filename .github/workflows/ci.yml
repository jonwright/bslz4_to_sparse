# CI: build one version-independent wheel per platform, then test it.
#
# The extension is package data (see setup.py/tools/build_extension.py), so a
# single wheel per platform serves Python 2.7-3.15 (c2py23 dlsym) and is
# tested across a Python-version subset.  One Linux worker builds x86_64,
# aarch64 and ppc64le (gcc 10 in the pypa manylinux2014 images, glibc 2.17;
# the manylinux tag is derived from the binary by tools/elf_check.py);
# the aarch64/ppc64le wheels are then run under qemu.  macOS builds for itself
# and Windows natively.  A published GitHub release uploads to PyPI, but only
# after every build + test job has passed.
name: CI

on:
  push:
    branches: [main, "jonwright/**"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_testpypi:
        description: "Publish the built wheels + sdist to TestPyPI"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- Linux: one worker, three targets, gcc 10 on glibc 2.17 ---
  #
  # Each target is built natively inside the pypa manylinux2014 image for its
  # arch (aarch64/ppc64le under qemu; only the compile is emulated).  gcc 10
  # (devtoolset-10) gives good code -- gcc 7 was measured ~1.8x slower on the
  # kcb kernel -- and glibc 2.17 keeps the wheel loadable everywhere down to
  # CentOS 7 / Ubuntu 18.04.  The extension links only libc/libm, so the floor
  # is set by the image; elf_check.py reads it back from the binary (and fails
  # if libstdc++/libgcc_s ever return) and the wheel tag is derived from that.
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,ppc64le
      - name: Build extensions (x86_64, aarch64, ppc64le) in manylinux2014
        run: |
          mkdir -p stage
          build() {  # <key> <docker platform> <image arch>
            docker run --rm --platform "$2" -v "$PWD:/workspace" -w /workspace \
              "quay.io/pypa/manylinux2014_$3" bash -c "
                set -e
                mkdir -p /tmp/b_$1
                /opt/python/cp312-cp312/bin/python tools/build_extension.py \
                  --target-platform $1 --out stage --build-dir /tmp/b_$1"
          }
          build linux_x86_64  linux/amd64   x86_64 &
          build linux_aarch64 linux/arm64   aarch64 &
          build linux_ppc64le linux/ppc64le ppc64le &
          wait $(jobs -p)
          ls -l stage
      - name: Package one wheel per target
        run: |
          python -m pip install --quiet build
          for spec in linux_x86_64:x86_64 linux_aarch64:aarch64 linux_ppc64le:ppc64le; do
            key=${spec%%:*}; arch=${spec##*:}
            so=stage/_bslz4_to_sparse.c2py23-$key.so
            tag=$(python tools/elf_check.py "$so" "$arch")
            echo "$key -> $tag"
            rm -f src/_bslz4_to_sparse.c2py23-*.so
            cp "$so" src/
            BSLZ4_SKIP_NATIVE_BUILD=1 BSLZ4_WHEEL_PLAT=$tag python -m build --wheel
          done
          rm -f src/_bslz4_to_sparse.c2py23-*.so
          ls -l dist
      - uses: actions/upload-artifact@v4
        with: {name: wheel-linux_x86_64, path: "dist/*x86_64.whl"}
      - uses: actions/upload-artifact@v4
        with: {name: wheel-linux_aarch64, path: "dist/*aarch64.whl"}
      - uses: actions/upload-artifact@v4
        with: {name: wheel-linux_ppc64le, path: "dist/*ppc64le.whl"}

  # --- Windows x64: MSVC, native ---
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build extension (MSVC)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat" >nul
          set MSVC_ENV=1
          set CC=cl
          set CXX=cl
          python tools\build_extension.py --target-platform win_amd64
      - name: Build wheel
        env:
          BSLZ4_SKIP_NATIVE_BUILD: "1"
          BSLZ4_WHEEL_PLAT: win_amd64
        run: |
          python -m pip install --quiet build
          python -m build --wheel
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-win_amd64
          path: dist/*.whl

  # --- macOS arm64: build, but only on main / manual dispatch ---
  #
  # Intel macOS (macos-13) is retired and macos-latest is Apple Silicon, so
  # this ships macosx_*_arm64 only. Gated off PRs and feature branches so the
  # slow macOS runner is not spent on every push. The binary is
  # version-independent (c2py23 dlsym), so the 2.7-3.15 coverage stays on
  # test-linux/test-py27; test-macos just validates the Darwin build.
  build-macos:
    name: build-macosx_arm64
    if: github.ref == 'refs/heads/main' || github.event_name != 'pull_request' && github.event_name != 'push'
    runs-on: macos-latest
    env:
      # Choose the deployment floor explicitly: the runner SDK is newer than
      # the oldest macOS we ship a wheel for.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build extension
        # No --target-platform: the host key is darwin_arm64, which is the
        # filename the runtime loader looks for. The wheel tag is set below.
        run: python3 tools/build_extension.py
      - name: Build wheel
        env:
          BSLZ4_SKIP_NATIVE_BUILD: "1"
          BSLZ4_WHEEL_PLAT: macosx_11_0_arm64
        run: |
          python -m pip install --quiet build
          python -m build --wheel
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-macosx_arm64
          path: dist/*.whl

  # --- Generate the decode-matrix fixture ONCE ---
  #
  # The decode test itself only needs numpy + pytest at runtime; h5py/hdf5plugin
  # (and pyFAI) are only needed to *write* the fixture, and h5py has no wheels
  # for some Pythons (e.g. 3.15) and pyFAI refuses to resolve on 3.14t.  So
  # generate the fixture once here on a known-good Python and share it.
  fixture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install fixture-generation deps (binary only)
        run: |
          python -m pip install --quiet --only-binary :all: h5py hdf5plugin numpy
      - name: Generate decode-matrix fixture
        run: python test/make_testcases.py matrix
      - uses: actions/upload-artifact@v4
        with:
          name: decode-matrix-fixture
          path: |
            test/matrix.h5
            test/matrix.json

  # --- sdist: must carry every source the native build opens ---
  #
  # The extension is package data compiled by tools/build_extension.py, not a
  # setuptools.Extension, so setuptools no longer adds its C sources to the
  # sdist implicitly. A MANIFEST.in omission only surfaces at `pip install`
  # time on a machine with no wheel (and in the release workflow's sdist job).
  # tools/check_sdist.py builds the sdist, checks every required build input is
  # in the tarball, then compiles the extracted sdist and imports it.
  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        # Only `build` is needed here: check_sdist.py pip-installs the sdist
        # into its own venv, which resolves the build-system and runtime deps.
        run: python -m pip install --quiet build
      - name: Check sdist contents and install it
        run: python tools/check_sdist.py --build
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # --- Optional: publish the built artifacts to TestPyPI (pre-release test) ---
  #
  # Manual only (workflow_dispatch + tick the box), so nothing reaches a
  # package index by accident. TestPyPI is not PyPI: normal `pip install
  # bslz4_to_sparse` will never see these. To test:
  #   pip install -i https://test.pypi.org/simple/ \
  #       --extra-index-url https://pypi.org/simple/ bslz4_to_sparse
  # Trusted publishing needs a "testpypi" environment registered on
  # test.pypi.org for this repo; alternatively set a TEST_PYPI_API_TOKEN
  # secret and pass `password: ${{ secrets.TEST_PYPI_API_TOKEN }}` below.
  publish-testpypi:
    needs: [build-linux, build-windows, build-macos, sdist, test-linux, test-oldlibc, test-qemu, test-windows, test-py27, test-macos]
    if: github.event_name == 'workflow_dispatch' && inputs.publish_testpypi
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - name: Show artifacts to be published
        run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  # --- Real PyPI: only on a published release, only after everything passed ---
  publish-pypi:
    needs: [build-linux, build-windows, build-macos, sdist, test-linux, test-oldlibc, test-qemu, test-windows, test-py27, test-macos]
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  # --- Linux x86_64: full decode test across a Python subset ---
  test-linux:
    needs: [build-linux, fixture]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13", "3.14", "3.14t", "3.15"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          name: wheel-linux_x86_64
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: decode-matrix-fixture
          path: test/
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Install wheel + test deps (binary only)
        run: |
          python -m pip install --quiet dist/*.whl
          python -m pip install --quiet --only-binary :all: numpy pytest
      - name: Run decode matrix
        run: python -m pytest test/test_decode_matrix.py -q

  # --- Old glibc: the x86_64 wheel on the oldest distros we claim to support ---
  test-oldlibc:
    needs: [build-linux, fixture]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 18.04: glibc 2.27, Python 3.6
          - image: ubuntu:18.04
            setup: |
              apt-get update -qq && apt-get install -y -qq python3 python3-pip >/dev/null
              python3 -m pip install --quiet --upgrade pip
              python3 -m pip install --quiet "numpy<1.20" pytest
            py: python3
          # CentOS 7 (manylinux2014): glibc 2.17
          - image: quay.io/pypa/manylinux2014_x86_64
            setup: |
              /opt/python/cp39-cp39/bin/python -m pip install --quiet numpy pytest
            py: /opt/python/cp39-cp39/bin/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wheel-linux_x86_64
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: decode-matrix-fixture
          path: test/
      - name: Install wheel + decode matrix on ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD:/w" -w /w ${{ matrix.image }} bash -c '
            set -e
            export DEBIAN_FRONTEND=noninteractive
            ${{ matrix.setup }}
            ${{ matrix.py }} -m pip install --quiet dist/*.whl
            ${{ matrix.py }} -c "import bslz4_to_sparse as b; print(b.__file__, b.available_backends())"
            ${{ matrix.py }} -m pytest test/test_decode_matrix.py -q
          '

  # --- aarch64 / ppc64le: run the cross-built wheels under qemu ---
  #
  # Proves the wheel installs, loads and decodes correctly on the target
  # ISA.  Under emulation the NEON/VSX tiers may report unavailable and fall
  # back to scalar; real-hardware SIMD coverage stays a manual/bench matter.
  test-qemu:
    needs: [build-linux, fixture]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: aarch64, platform: linux/arm64}
          - {arch: ppc64le, platform: linux/ppc64le}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: all
      - uses: actions/download-artifact@v4
        with:
          name: wheel-linux_${{ matrix.arch }}
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: decode-matrix-fixture
          path: test/
      - name: Install + decode matrix under qemu
        timeout-minutes: 30
        run: |
          docker run --rm --platform ${{ matrix.platform }} -v "$PWD:/w" -w /w \
            python:3.12-slim-bookworm bash -c '
              set -e
              pip install --quiet --only-binary :all: numpy pytest
              pip install --quiet dist/*.whl
              python -c "import bslz4_to_sparse as b; print(b.__file__, b.available_backends())"
              python -m pytest test/test_decode_matrix.py -q
            '

  # --- Windows x64: native build + test ---
  test-windows:
    needs: [build-windows, fixture]
    runs-on: windows-latest
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          name: wheel-win_amd64
          path: dist\
      - uses: actions/download-artifact@v4
        with:
          name: decode-matrix-fixture
          path: test/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install wheel + test deps (binary only)
        run: |
          for /f %%f in ('dir /b /s dist\*.whl') do python -m pip install --quiet "%%f"
          python -m pip install --quiet --only-binary :all: numpy pytest
      - name: Run decode matrix
        run: python -m pytest test\test_decode_matrix.py -q

  # --- Python 2.7: build in an old-glibc (18.04) container, test decode ---
  test-py27:
    needs: fixture
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: decode-matrix-fixture
          path: test/
      - name: Build + test in ubuntu:18.04 (python2.7, glibc 2.27)
        run: |
          docker run --rm -v "$PWD:/workspace" ubuntu:18.04 bash -lc '
            set -e
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq && apt-get install -y -qq \
              python2.7 python2.7-dev python3 python3-pip build-essential curl >/dev/null
            curl -sS https://bootstrap.pypa.io/pip/2.7/get-pip.py | python2.7
            python2.7 -m pip install --quiet "numpy<1.17" pytest
            cd /workspace
            python3 tools/build_extension.py
            python3 setup.py build --build-lib=lib
            BSLZ4_TO_SPARSE_PATH=/workspace/lib \
              python2.7 -m pytest test/test_decode_matrix.py -q
          '

  # --- macOS arm64: decode test, same gating as build-macos ---
  test-macos:
    needs: [build-macos, fixture]
    if: github.ref == 'refs/heads/main' || github.event_name != 'pull_request' && github.event_name != 'push'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          name: wheel-macosx_arm64
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: decode-matrix-fixture
          path: test/
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install wheel + test deps (binary only)
        run: |
          python -m pip install --quiet dist/*.whl
          python -m pip install --quiet --only-binary :all: numpy pytest
      - name: Smoke test
        run: python -c "import bslz4_to_sparse as b; print(b.__file__, b.available_backends())"
      - name: Run decode matrix
        run: python -m pytest test/test_decode_matrix.py -q
